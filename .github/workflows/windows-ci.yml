name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows debug app
        run: flutter build windows --debug

      - name: Test native helpers
        run: >
          ctest
          --test-dir build/windows/x64
          -C Debug
          --output-on-failure

      - name: Verify managed EUD bundle and build without Python on PATH
        shell: pwsh
        run: |
          $env:EUDDRAFT_AUDIT_ZIP = (Resolve-Path 'build/eud-downloads/euddraft0.10.2.5.zip').Path
          $env:EUDDRAFT_TEST_INSTALLATION = (Resolve-Path 'build/windows/x64/runner/Debug/tools/euddraft/0.10.2.5-editor.1').Path
          $env:EUDDRAFT_TEST_BUNDLED = '1'
          $env:MAP_ARCHIVE_HELPER_PATH = (Resolve-Path 'build/windows/x64/runner/Debug/map_archive_helper.exe').Path
          flutter test test/infrastructure/bundled_eud_tool_test.dart test/integration/real_euddraft_build_smoke_test.dart test/integration/bundled_euddraft_process_control_test.dart --concurrency=1

      - name: Smoke test bundled map archive helper
        shell: pwsh
        run: |
          $env:MAP_ARCHIVE_HELPER_PATH = (Resolve-Path "build/windows/x64/runner/Debug/map_archive_helper.exe").Path
          $env:MAP_ARCHIVE_TEST_MAP = (Resolve-Path "test/fixtures/maps/generated/minimal-self-authored.scx").Path

          flutter test test/infrastructure/bundled_map_archive_helper_test.dart
