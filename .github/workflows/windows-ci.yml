name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows debug app
        run: flutter build windows --debug

      - name: Test native map archive helper
        run: >
          ctest
          --test-dir build/windows/x64
          -C Debug
          --output-on-failure
          -R map_archive_helper_native

      - name: Smoke test bundled map archive helper
        shell: pwsh
        run: |
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP "map-archive-fixture"
          New-Item -ItemType Directory -Path $fixtureDirectory -Force | Out-Null
          $fixtureBuilder = (Resolve-Path "build/windows/x64/map_archive_helper/Debug/map_archive_helper_native_test.exe").Path
          $env:MAP_ARCHIVE_HELPER_PATH = (Resolve-Path "build/windows/x64/runner/Debug/map_archive_helper.exe").Path
          $env:MAP_ARCHIVE_TEST_MAP = Join-Path $fixtureDirectory "generated test map.scx"
          $scenarioPath = Join-Path $fixtureDirectory "expected scenario.chk"

          & $fixtureBuilder --create-fixture $env:MAP_ARCHIVE_TEST_MAP $scenarioPath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          flutter test test/infrastructure/bundled_map_archive_helper_test.dart
